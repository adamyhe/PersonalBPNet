[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PersonalBPNet"
version = "0.8.0"
description = "PyTorch BPNet-family models (CLIPNET, ProCapNet, PauseNet) for base-resolution genomic signal prediction, extending bpnetlite."
readme = "README.md"
authors = [{ name = "Adam He", email = "adamyhe@gmail.com" }]
license = { file = "LICENSE" }
keywords = [
    "genomics",
    "deep-learning",
    "pytorch",
    "bpnet",
    "clipnet",
    "pro-cap",
    "regulatory-genomics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = { Homepage = "https://github.com/adamyhe/PersonalBPNet", Repository = "https://github.com/adamyhe/PersonalBPNet", Issues = "https://github.com/adamyhe/PersonalBPNet/issues", Changelog = "https://github.com/adamyhe/PersonalBPNet/blob/main/CHANGELOG.md", Documentation = "https://github.com/adamyhe/PersonalBPNet/tree/main/docs" }
requires-python = ">= 3.11"
dependencies = ["bpnet-lite>=1.0.0", "tangermeme>=1.0.0", "pyfaidx", "numba"]

[project.optional-dependencies]
tf = ["h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
clipnet = "cli.clipnet:cli"
pausenet = "cli.pausenet:cli"
clipnet_tf = "cli.tf:cli"

[tool.uv]
# bpnet-lite declares macs3 as a dependency, but neither bpnet-lite's code nor
# ours imports it. macs3 ships no wheels, and its source build fails on some
# Python versions (e.g. 3.11, where it gets the newest Cython but an older
# numpy). Excluding it (and its own dependencies) keeps installs wheel-only.
# This applies to uv (the lockfile, development, CI); `pip install` from PyPI
# still pulls it in through bpnet-lite.
exclude-dependencies = ["macs3"]
